<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Дистанционное обучение РТУ МИРЭА</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --m-navy: #1d4d8c;
      --m-navy-dark: #15396a;
      --m-link: #0f6cbf;
      --m-link-hover: #094d8a;
      --m-text: #1d2125;
      --m-text-soft: #6a737d;
      --m-bg: #f5f6f8;
      --m-border: #d6dadf;
      --m-card-bg: #ffffff;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--m-bg);
      color: var(--m-text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--m-link); text-decoration: none; }
    a:hover { color: var(--m-link-hover); text-decoration: underline; }

    .topbar {
      background: var(--m-navy);
      color: #fff;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-shadow: 0 1px 0 rgba(0,0,0,.1);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -.2px;
    }
    .brand:hover { color: #fff; text-decoration: none; }
    .eagle {
      width: 42px; height: 42px;
      background: #fff;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }
    .login-card {
      background: var(--m-card-bg);
      border: 1px solid var(--m-border);
      border-radius: 4px;
      padding: 36px 40px;
      max-width: 920px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,.04);
    }
    .login-card h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px;
      color: var(--m-text);
      letter-spacing: -.2px;
    }
    .login-card .subtitle {
      color: var(--m-text-soft);
      font-size: 14px;
      margin: 0 0 28px;
    }

    .demo-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      background: #cfe2ff;
      border: 1px solid #b6d4fe;
      border-radius: 4px;
      margin-bottom: 28px;
      font-size: 13px;
      color: #084298;
      line-height: 1.5;
    }
    .demo-banner-badge {
      background: var(--m-link);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: .5px;
      flex-shrink: 0;
      line-height: 1.3;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .student-card {
      background: #fafbfc;
      border: 1px solid var(--m-border);
      border-radius: 6px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .student-card:hover {
      border-color: var(--m-link);
      box-shadow: 0 4px 12px rgba(15, 108, 191, .12);
    }
    .student-card:active { transform: scale(.98); }
    .student-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .student-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--m-text);
      line-height: 1.3;
    }
    .student-group {
      font-size: 12px;
      color: var(--m-text-soft);
      font-family: ui-monospace, "JetBrains Mono", monospace;
    }
    .student-meta {
      font-size: 10px;
      color: #9aa5b2;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 4px;
    }
    .new-tab-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--m-link);
      text-decoration: none;
      padding: 4px 8px;
      border: 1px dashed var(--m-link);
      border-radius: 4px;
      margin-top: 4px;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
    }
    .new-tab-link:hover {
      background: var(--m-link);
      color: #fff;
      text-decoration: none;
    }
    .new-tab-link svg { width: 11px; height: 11px; }

    .parallel-hint {
      font-size: 12px;
      color: var(--m-text-soft);
      margin-top: 22px;
      padding: 10px 14px;
      background: #fafbfd;
      border: 1px solid var(--m-border);
      border-radius: 4px;
      line-height: 1.5;
    }
    .parallel-hint code {
      background: #f0f2f5;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }

    .footer {
      text-align: center;
      padding: 16px;
      color: var(--m-text-soft);
      font-size: 12px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--m-text-soft);
    }
    .error {
      padding: 16px;
      background: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header class="topbar">
  <a href="#" class="brand">
    <span>Дистанционное обучение РТУ МИРЭА</span>
  </a>
</header>

<main>
  <div class="login-card">
    <h1>Войти в личный кабинет</h1>
    <p class="subtitle">Выберите учётную запись для входа</p>

    <div class="demo-banner">
      <span class="demo-banner-badge">DEMO</span>
      <div>
        <strong>Это имитация авторизации</strong> для демонстрации работы LTI 1.3-интеграции
        Cloud-Lab Manager со стороны Moodle. 
      </div>
    </div>

    <div id="students-area" class="loading">Загружаем список студентов…</div>
  </div>
</main>

<div class="footer">
  © РТУ МИРЭА · Дистанционное обучение · сборка demo для хакатона
</div>

<script>
  const STORAGE_KEY = "mock-student";

  async function render() {
    const area = document.getElementById("students-area");
    try {
      const resp = await fetch("/mock-students.json", { cache: "no-store" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const students = await resp.json();

      const grid = document.createElement("div");
      grid.className = "students-grid";

      for (const s of students) {
        const card = document.createElement("div");
        card.className = "student-card";

        const avatar = document.createElement("div");
        avatar.className = "student-avatar";
        avatar.style.background = s.gradient;
        avatar.textContent = s.initials;

        const name = document.createElement("div");
        name.className = "student-name";
        name.textContent = s.name;

        const group = document.createElement("div");
        group.className = "student-group";
        group.textContent = s.group;

        const meta = document.createElement("div");
        meta.className = "student-meta";
        meta.textContent = "студент";

        // основной клик — сохранить в localStorage и перейти
        card.style.cursor = "pointer";
        card.addEventListener("click", (event) => {
          if (event.target.closest(".new-tab-link")) return;
          selectStudent(s);
        });

        // ссылка «в новой вкладке» — без записи в localStorage
        // даёт изолированную сессию для параллельного теста двух студентов
        const newTab = document.createElement("a");
        newTab.className = "new-tab-link";
        newTab.href = "/fake-moodle.html?student=" + encodeURIComponent(s.external_id);
        newTab.target = "_blank";
        newTab.rel = "noopener noreferrer";
        newTab.title = "Параллельная сессия без записи в localStorage";
        newTab.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
          + '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'
          + '<polyline points="15 3 21 3 21 9"/>'
          + '<line x1="10" y1="14" x2="21" y2="3"/></svg>'
          + 'в новой вкладке';

        card.append(avatar, name, group, meta, newTab);
        grid.appendChild(card);
      }

      area.replaceWith(grid);

      const hint = document.createElement("div");
      hint.className = "parallel-hint";
      hint.innerHTML =
        '<strong>Параллельный тест:</strong> кликните по карточке студента — это «вход» (запись в localStorage). '
        + 'Нужно открыть нескольких студентов одновременно в одном браузере? Используйте кнопку '
        + '<code>в новой вкладке</code> — там сессия привязана к URL '
        + '(<code>?student=&lt;external_id&gt;</code>) и не конфликтует с другими вкладками.';
      grid.after(hint);
    } catch (e) {
      area.className = "error";
      area.textContent = "Не удалось загрузить список студентов: " + e.message;
    }
  }

  function selectStudent(student) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(student));
    window.location.href = "/fake-moodle.html";
  }

  render();
</script>

</body>
</html>
