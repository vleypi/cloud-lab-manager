name: "Лаба 03 PostgreSQL с прикладной БД"
version: "1"
description: >-
  Студент устанавливает PostgreSQL, создаёт БД lab_app, пользователя app_user,
  выдаёт права и проверяет подключение

checks:
  - name: пакет postgresql установлен
    section: software
    type: package_installed
    package: postgresql

  - name: сервис postgresql активен
    section: software
    type: systemd_active
    unit: postgresql

  - name: процесс postgres запущен
    section: os
    type: process_running
    name: postgres
    min_count: 1

  - name: порт 5432/tcp слушается
    section: network
    type: port_listening
    port: 5432
    protocol: tcp

  - name: системный пользователь postgres существует
    section: os
    type: user_exists
    username: postgres
    shell: /bin/bash

  - name: в pg_hba.conf разрешён local-доступ для md5
    section: software
    type: file_contains
    path: /etc/postgresql/14/main/pg_hba.conf
    pattern: '^\s*local\s+all\s+all\s+md5'

  - name: база данных lab_app существует
    section: software
    type: command_exit_zero
    cmd: "sudo -n -u postgres psql -tA -c \"SELECT 1 FROM pg_database WHERE datname='lab_app';\" | grep -q '^1$'"

  - name: роль app_user существует
    section: software
    type: command_exit_zero
    cmd: "sudo -n -u postgres psql -tA -c \"SELECT 1 FROM pg_roles WHERE rolname='app_user';\" | grep -q '^1$'"

  - name: app_user может коннектиться к lab_app
    section: software
    type: command_output_matches
    cmd: "sudo -n -u postgres psql -tA -c \"SELECT has_database_privilege('app_user', 'lab_app', 'CONNECT');\""
    pattern: '^t$'

  - name: размер pg_data меньше 500 MB
    section: os
    severity: warning
    type: command_output_compare
    cmd: "sudo -n du -sm /var/lib/postgresql 2>/dev/null | awk '{print $1}'"
    operator: "<"
    value: 500

  - name: свободно >= 200 MB ОЗУ
    section: os
    severity: info
    type: command_output_compare
    cmd: "free -m | awk '/Mem:/ {print $7}'"
    operator: ">="
    value: 200
