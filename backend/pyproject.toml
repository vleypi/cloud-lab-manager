[project]
name = "cloud-lab-manager"
version = "0.1.0"
description = "Шлюз лабораторных стендов на платформе Кибер Инфраструктура"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "openstacksdk>=4.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "psycopg2-binary>=2.9.10",
    "asyncssh>=2.18.0",
    "PyYAML>=6.0.2",
    "PyJWT[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "bandit>=1.7.10",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # assert allowed in dev
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S104",   # bind 0.0.0.0 is intentional inside the container
    "RUF001", # Cyrillic letters in strings are intentional (Russian UI text)
    "RUF002", # Cyrillic letters in docstrings are intentional
    "RUF003", # Cyrillic letters in comments are intentional
    "E501",   # line length already enforced by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"app/inspector/checks.py" = ["S108"]  # /tmp file lives inside the lab VM via SSH, not on host
"app/services/capacity_audit.py" = ["S110", "SIM105"]  # audit must never break primary flow
"app/services/lti_service.py" = ["S110"]  # commits guarded explicitly
"app/services/lifecycle_settings.py" = ["S110"]
"app/services/lifecycle_service.py" = ["S110"]
"app/tasks/stands.py" = ["S110", "SIM105"]  # cleanup best-effort, errors logged elsewhere
"app/services/auth_service.py" = ["SIM105"]
"app/main.py" = ["E402"]  # imports under settings load
"app/celery_app.py" = ["E402"]
"app/api/v1/endpoints/console.py" = ["S110", "SIM105", "SIM108"]
"app/api/v1/endpoints/pool.py" = ["E402"]
"app/services/console_session.py" = ["SIM102"]
"app/services/guacd_bridge.py" = ["S110", "UP038"]
"app/services/capacity_checker.py" = ["SIM103"]

[tool.bandit]
exclude_dirs = ["scripts", ".venv", "tests"]
skips = ["B101"]  # B101: asserts allowed in dev

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true
