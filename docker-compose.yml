x-app-base: &app-base
  image: cloud-lab-manager/backend:latest
  env_file:
    - .env.example
    - path: .env
      required: false
  security_opt:
    - no-new-privileges:true
  read_only: false
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - secrets_data:/app/secrets
    - ./config/check_templates:/app/check_templates:ro
    - ./backend/app:/app/app:ro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ki_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ki_password}
      POSTGRES_DB: ${POSTGRES_DB:-cloud_lab_manager}
    volumes:
      - db_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["api"]
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *app-base
    command: ["worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    <<: *app-base
    command: ["beat"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: cloud-lab-manager/web:latest
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${NGINX_HOST_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx:/etc/nginx/templates:ro
    environment:
      LTI_EMBED_FRAME_ANCESTORS: ${LTI_EMBED_FRAME_ANCESTORS:-'self'}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  secrets_data:
