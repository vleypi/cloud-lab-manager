x-app-base: &app-base
  image: cloud-lab-manager/backend:latest
  env_file:
    - .env.example
    - path: .env
      required: false
  security_opt:
    - no-new-privileges:true
  read_only: false
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    GUACD_HOST: guacd
    GUACD_PORT: "4822"
  volumes:
    - secrets_data:/app/secrets
    - ./config/check_templates:/app/check_templates:ro
    - ./config/console_catalog.example.yaml:/app/config/console_catalog.example.yaml:ro
    - ./backend/app:/app/app:ro
    - ./backend/scripts:/app/scripts:ro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ki_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ki_password}
      POSTGRES_DB: ${POSTGRES_DB:-cloud_lab_manager}
    volumes:
      - db_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "4822"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 2g

  api:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    command: ["api"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 180s

  worker:
    <<: *app-base
    command: ["worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s

  beat:
    <<: *app-base
    command: ["beat"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      network: host
    image: cloud-lab-manager/web:latest
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_started
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('net').createConnection(3000,'0.0.0.0').on('connect',function(){this.end();process.exit(0)}).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "${NGINX_HOST_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx:/etc/nginx/templates:ro
    environment:
      LTI_EMBED_FRAME_ANCESTORS_EXTRA: ${LTI_EMBED_FRAME_ANCESTORS_EXTRA:-}
      NOVNC_UPSTREAM: ${NOVNC_UPSTREAM:-127.0.0.1:6080}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/v1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
  redis_data:
  secrets_data:
