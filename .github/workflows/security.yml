name: security

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  python-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.7.4"
      - name: Lint
        working-directory: backend
        run: ruff check app
      - name: Format check
        working-directory: backend
        run: ruff format --check app

  python-sast:
    name: Backend SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit[toml]==1.7.10"
      - name: Run bandit
        working-directory: backend
        run: bandit -c pyproject.toml -r app -f sarif -o ../bandit.sarif || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  python-deps-audit:
    name: Backend deps (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"
      - name: Audit dependencies
        working-directory: backend
        run: pip-audit --strict --progress-spinner off -f json -o ../pip-audit.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Lint
        working-directory: frontend
        run: npx eslint . --max-warnings 0
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-deps-audit:
    name: Frontend deps audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  container-scan:
    name: Container image scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t cloud-lab-manager/backend:ci .
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t cloud-lab-manager/frontend:ci .
      - name: Trivy backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloud-lab-manager/backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloud-lab-manager/frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload SARIF (backend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      - name: Upload SARIF (frontend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
